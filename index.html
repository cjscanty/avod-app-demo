  posts:[{sp:"Showcase Gallery", a:"Dayo A.", b:"Pitch day recap: our savings-map project got seed funding from two families in our pod.", w:"2026-09-06 14:00", st:"published"}],
  grades:[["Dayo Adeyemi","Money, Markets & Community Wealth","My First Savings Map",100,91,"graded"],["Eshe Kamau","Money, Markets & Community Wealth","My First Savings Map",100,null,"ungraded"]],
  audit:[["2026-08-25 12:00","admin@ubuntu.avodlearning.org","course.published","course crs_wealth"]]}
};
const NAVS = [["dash","Village Square","◈"],["journey","My Journey","◉"],["studio","Course Studio","✦"],["learners","Learners","❖"],["gradebook","Gradebook","✎"],["voice","Village Voice","◍"],["branding","Branding","❑"],["chronicle","Chronicle","☰"]];
const LEVELS={1:"Seedling",2:"Growing",3:"Flowering",4:"Rooted"};
let village="cls_kp", view="dash", JL="tamika", selCourse=null;
const q=new URLSearchParams(location.search); if(q.get("village")&&DATA[q.get("village")]) village=q.get("village"); if(q.get("journey")) { JL=q.get("journey"); view="journey"; }
if(!DATA[village].learners.find(l=>l.id===JL)) JL=DATA[village].learners.find(l=>l.status==="active").id;
const cls=()=>DATA[village];
function lessonsList(c,learn){ let out=[]; (c.modules||[]).forEach(m=>m.ls.forEach(l=>out.push({m:m.t,t:l[0],ty:l[1],min:l[2]}))); if(learn){(learn.done[c.id]||[]).forEach(d=>{let o=out.find(o=>o.t===d[0]); if(o)o.done=d;});((learn.doing[c.id])||[]).forEach(t=>{let o=out.find(x=>x.t===t); if(o)o.doing=true;});} return out;}
function syncUrl(){ const u=new URL(location.href); u.searchParams.set("village",village); if(view==="journey"&&JL)u.searchParams.set("journey",JL); else u.searchParams.delete("journey"); history.replaceState(null,"",u); }
function note(m){ const n=document.getElementById("note"); n.textContent=m; n.style.display="block"; setTimeout(()=>n.style.display="none",3200); }
function renderNav(){
  const items = NAVS.map(n=>'<button class="'+(view===n[0]?'on':'')+'" data-view="'+n[0]+'"><span>'+n[2]+'</span> <em>'+n[1]+'</em></button>').join("");
  document.getElementById("nav").innerHTML=items;
  document.getElementById("tabs").innerHTML=items;
  document.getElementById("tenantSel").innerHTML=Object.keys(DATA).map(k=>'<option value="'+k+'" '+(k===village?"selected":"")+'>'+DATA[k].emoji+' '+DATA[k].name+'</option>').join("");
}
function go(v){ view=v; if(v!=="studio")selCourse=null; syncUrl(); renderNav(); render(); window.scrollTo(0,0); }
function switchVillage(v){ village=v; JL=DATA[v].learners.find(l=>l.status==="active").id; selCourse=null; syncUrl(); renderNav(); render(); }
function setJL(id){ JL=id; syncUrl(); render(); }
function pick(c){ selCourse=selCourse===c?null:c; render(); }
function badge(st){ return '<span class="badge '+(st==="flagged"?"b-flag":st==="published"||st==="active"||st==="graded"?"b-pub":"b-draft")+'">'+st+'</span>'; }
function render(){ const c=cls(); const el=document.getElementById("app");
 if(view==="dash"){
  const act=c.learners.filter(l=>l.status==="active").length, pub=c.courses.filter(x=>x.status==="published").length;
  const enroll=c.learners.reduce((a,l)=>a+l.enroll.length,0), flagged=c.posts.filter(p=>p.st==="flagged").length, ung=c.grades.filter(g=>!g[4]).length;
  let prow=""; c.courses.filter(x=>x.status==="published").forEach(x=>{ let tot=0,done=0,en=0; c.learners.forEach(l=>{ if(l.enroll.includes(x.id)){en++; let ll=lessonsList(x,l); tot+=ll.length; done+=ll.filter(o=>o.done).length; } }); const p=tot?Math.round(done/tot*100):0;
    prow+='<div class="prow"><div class="pct">'+p+'%</div><div class="pt">'+x.title+'</div><div class="ps">'+en+' learners · '+lessonsList(x).length+' lessons '+badge(x.status)+'</div><div class="bar"><i style="width:'+p+'%"></i></div></div>'; });
  el.innerHTML='<div class="hero"><div><div class="kick">African Village of Discovery</div><h1>'+c.name+' '+c.emoji+'</h1><div class="hsub">'+c.domain+' · Every child belongs to the village.</div></div><div class="edge">◆ ❖ ◆ ❖ ◆ ❖ ◆ ❖ ◆</div></div>'
  +'<div class="stats">'
  +'<div class="stat"><div class="n">'+act+'</div><div class="l">Active learners</div><div class="s">enrolled in your village</div></div>'
  +'<div class="stat"><div class="n">'+pub+'</div><div class="l">Published courses</div><div class="s">live in the catalog</div></div>'
  +'<div class="stat"><div class="n">'+enroll+'</div><div class="l">Active enrollments</div><div class="s">journeys underway</div></div>'
  +'<div class="stat"><div class="n">'+flagged+'</div><div class="l">Flagged posts</div><div class="s">awaiting moderation</div></div>'
  +'<div class="stat"><div class="n">'+ung+'</div><div class="l">Ungraded items</div><div class="s">in the gradebook queue</div></div></div>'
  +'<div class="cols"><div class="panel"><div class="ptitle">Course completion across the village</div>'+(prow||'<div class="hsub">No courses yet.</div>')+'</div>'
  +'<div class="panel"><div class="ptitle">Latest chronicle entries</div>'
  +(c.audit.map(a=>'<div class="au"><div class="a">'+a[2]+'</div><div class="m">'+a[1]+' · '+a[3]+'</div><div class="w">'+a[0]+'</div></div>').join("")||'<div class="hsub">The chronicle is empty.</div>')+'</div></div>';
 } else if(view==="journey"){
  const l=c.learners.find(x=>x.id===JL)||c.learners.filter(x=>x.status==="active")[0];
  let cards=""; l.enroll.forEach(cid=>{ const co=c.courses.find(x=>x.id===cid); const ll=lessonsList(co,l); const d=ll.filter(o=>o.done).length; const p=Math.round(d/ll.length*100); const nx=ll.find(o=>!o.done);
   cards+='<div class="jcard"><div class="jtop"><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(201,162,39,.15)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="url(#rg'+cid+')" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="'+(163.4*(1-p/100)).toFixed(1)+'"/><defs><linearGradient id="rg'+cid+'"><stop offset="0%" stop-color="#C0532F"/><stop offset="100%" stop-color="#FFD870"/></linearGradient></defs></svg><div class="rp">'+p+'%</div></div>'
   +'<div><div class="jct">'+co.title+'</div><div class="jcl">'+co.label+'</div></div></div>'
   +(nx?'<div class="jnext"><em>Up next</em>'+nx.m+' — '+nx.t+' <span style="color:#6f6248">('+nx.ty+' · '+nx.min+' min)</span></div>':'<div class="jnext jd"><em>Complete</em>Every lesson in this journey is finished. Well walked.</div>')+'</div>'; });
  let opts=""; c.learners.filter(x=>x.status==="active").forEach(x=>{ opts+='<option value="'+x.id+'" '+(x.id===l.id?"selected":"")+'>'+x.name+' (G'+x.grade+')</option>'; });
  el.innerHTML='<div class="jhero"><div class="jname">The Journey of '+l.name.split(" ")[0]+'</div><div class="hsub">Grade '+l.grade+' · '+c.name+' — read-only window for learners &amp; parents.</div>'
   +'<select class="tenant" style="max-width:240px;margin:0 0 0 auto" onchange="setJL(this.value)">'+opts+'</select>'
   +'<button class="btn" onclick="copyLink(\''+l.id+'\')">Copy parent link</button>'
   +'<button class="btn btn-go" onclick="openSum(\''+l.id+'\')">Weekly summary card</button></div>'
   +'<div class="jcards">'+(cards||'<div class="panel hsub">No journeys underway yet.</div>')+'</div>'
   +'<div class="cols"><div class="panel"><div class="ptitle">Mastery by village label</div>'
   +(l.mastery.length?l.mastery.map(m=>'<div class="mrow"><div class="mname">'+m[0]+(m[2]?'<div class="mnote">'+m[2]+'</div>':"")+'</div><div class="mtrack"><div class="mfill" style="width:'+(m[1]/4*100)+'%"></div></div><div class="mlvl">'+LEVELS[m[1]]+'</div></div>').join(""):'<div class="hsub">Mastery blooms as journeys are walked.</div>')
   +'</div><div class="panel"><div class="ptitle">From the Showcase Gallery</div>'
   +(c.posts.filter(p=>p.sp==="Showcase Gallery"&&p.st==="published").map(p=>'<div class="post"><div><span class="pa">'+p.a+'</span> <span style="color:#6f6248;font-size:11px">· '+p.w.slice(0,10)+'</span></div><div class="pb" style="margin-bottom:0">'+p.b+'</div></div>').join("")||'<div class="hsub">No showcase pieces yet.</div>')
   +'</div></div>';
 } else if(view==="studio"){
  let cat=""; c.courses.forEach(x=>{ cat+='<div class="course '+(selCourse===x.id?'on':'')+'" onclick="pick(\''+x.id+'\')"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div class="ct">'+x.title+'</div>'+badge(x.status)+'</div><div class="cm">'+x.label+' · '+x.modules.length+' modules · '+lessonsList(x).length+' lessons</div><div class="cd">'+x.desc+'</div></div>'; });
  let tree='<div class="hsub">Select a course on the left to view its structure.</div>';
  if(selCourse){ const x=c.courses.find(v=>v.id===selCourse); if(x.modules.length){ tree=x.modules.map((m,i)=>'<div class="mod"><div class="mt"><b style="color:#C0532F;font-family:Palatino,Georgia,serif">'+(i+1)+'</b> '+m.t+'</div><div class="mo">'+m.o+'</div>'+m.ls.map(l=>'<div class="les">▸ '+l[0]+'<span class="lm">'+l[1]+' · '+l[2]+' min</span></div>').join("")+'</div>').join(""); } else tree='<div class="hsub">Draft compiled by the Curriculum Engine — modules await educator review.</div>'; }
  el.innerHTML='<div class="vhead"><h2>Course Studio</h2><div class="vsub">Courses as modules and lessons. Read-only in this demo.</div></div>'
  +'<div class="cols" style="grid-template-columns:1fr 1.15fr"><div class="panel"><div class="ptitle">Course catalog</div>'+cat+'</div><div class="panel"><div class="ptitle">Curriculum structure</div>'+tree+'</div></div>';
 } else if(view==="learners"){
  el.innerHTML='<div class="vhead"><h2>Learners</h2><div class="vsub">Your village roster.</div></div><div class="panel"><table class="t"><tr><th>Learner</th><th>Grade</th><th>Enrollments</th><th>Status</th></tr>'
   +c.learners.map(l=>'<tr><td>'+l.name+'</td><td>'+l.grade+'</td><td>'+l.enroll.length+'</td><td>'+badge(l.status)+'</td></tr>').join("")+'</table></div>';
 } else if(view==="gradebook"){
  el.innerHTML='<div class="vhead"><h2>Gradebook</h2><div class="vsub">Percent means points earned out of points possible.</div></div><div class="panel"><table class="t"><tr><th>Learner</th><th>Course</th><th>Item</th><th>Possible</th><th>Earned</th><th>Status</th></tr>'
   +c.grades.map(g=>'<tr><td>'+g[0]+'</td><td>'+g[1]+'</td><td>'+g[2]+'</td><td>'+g[3]+'</td><td>'+(g[4]!=null?g[4]+" ("+Math.round(g[4]/g[3]*100)+"%)":"—")+'</td><td>'+badge(g[5])+'</td></tr>').join("")+'</table></div>';
 } else if(view==="voice"){
  el.innerHTML='<div class="vhead"><h2>Village Voice</h2><div class="vsub">Showcases, journey stories, and garden chat. Moderation is interactive in the full app.</div></div><div class="panel">'
   +c.posts.map(p=>'<div class="post"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="pa">'+p.a+'</span> <span style="color:#6f6248;font-size:11px">· '+p.w+'</span></div>'+badge(p.st)+'</div><div class="pb">'+p.b+'</div><div class="ps">'+p.sp+'</div></div>').join("")+'</div>';
 } else if(view==="branding"){
  el.innerHTML='<div class="vhead"><h2>Branding</h2><div class="vsub">Each classroom identity travels with its learners everywhere in AVOD.</div></div>'
   +'<div class="bprev" style="background:linear-gradient(140deg,'+c.secondary+' 0%,'+c.secondary+'cc 60%,'+c.primary+'33 100%)"><div class="bt" style="color:'+c.primary+'">'+c.emoji+' '+c.name+'</div><div class="bd" style="color:'+c.primary+'">'+c.domain+'</div></div>'
   +'<div class="panel"><div class="ptitle">Identity</div><table class="t"><tr><th>Name</th><th>Domain</th><th>Mark</th><th>Primary</th><th>Secondary</th></tr><tr><td>'+c.name+'</td><td>'+c.domain+'</td><td style="font-size:18px">'+c.emoji+'</td><td style="color:'+c.primary+'">'+c.primary+'</td><td>'+c.secondary+'</td></tr></table></div>';
 } else if(view==="chronicle"){
  el.innerHTML='<div class="vhead"><h2>The Chronicle</h2><div class="vsub">Every meaningful act in this classroom, written down.</div></div><div class="panel"><table class="t"><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th></tr>'
   +c.audit.map(a=>'<tr><td>'+a[0]+'</td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td></tr>').join("")+'</table></div>';
 }}
function copyLink(id){ const u=new URL(location.href); u.searchParams.set("village",village); u.searchParams.set("journey",id); if(navigator.clipboard){navigator.clipboard.writeText(u.toString()).then(()=>note("Journey link copied — paste it to the family.")).catch(()=>prompt("Copy this journey link:",u));} else prompt("Copy this journey link:",u); }
function openSum(id){ const c=cls(); const l=c.learners.find(x=>x.id===id);
 let walked=[],nexts=[],tot=0,done=0;
 l.enroll.forEach(cid=>{ const co=c.courses.find(x=>x.id===cid); const ll=lessonsList(co,l); done+=ll.filter(o=>o.done).length; tot+=ll.length; ll.filter(o=>o.done).forEach(o=>walked.push([o.t,co.title,o.done[2]])); const nx=ll.find(o=>!o.done); if(nx)nexts.push([nx.t,co.title,nx.ty,nx.min]); });
 const pct=tot?Math.round(done/tot*100):0; const mast=l.mastery.slice().sort((a,b)=>b[1]-a[1]).slice(0,4);
 let h='<div class="overlay" onclick="if(event.target===this)closeSum()"><div class="sum">'
  +'<div class="ban"><span style="font-size:26px">'+c.emoji+'</span><div><b>'+c.name+'</b><i>African Village of Discovery · Weekly Journey Summary</i></div></div>'
  +'<div class="who">'+l.name+'<span>Grade '+l.grade+' · Sep 2 – Sep 8</span></div>'
  +'<div class="sstat"><div><b>'+walked.length+'</b><span>steps this week</span></div><div><b>'+l.enroll.length+'</b><span>journeys underway</span></div><div><b>'+pct+'%</b><span>overall progress</span></div></div>';
 if(walked.length) h+='<div class="ssec"><span class="st">✦ Walked this week</span>'+walked.slice(0,5).map(w=>'<div class="sline">'+w[0]+'<em>'+w[1]+(w[2]!=null?" · "+w[2]+"%":"")+'</em></div>').join("")+'</div>';
 if(nexts.length) h+='<div class="ssec"><span class="st">◈ Up next</span>'+nexts.slice(0,3).map(n=>'<div class="sline">'+n[0]+'<em>'+n[1]+' · '+n[2]+' · '+n[3]+' min</em></div>').join("")+'</div>';
 if(mast.length) h+='<div class="ssec"><span class="st">❖ Growing mastery</span>'+mast.map(m=>'<div class="sline">'+m[0]+'<em>'+LEVELS[m[1]]+'</em></div>').join("")+'</div>';
 h+='<div class="sfoot">'+c.domain+' · shared with love by the village</div>'
  +'<div class="sact"><button class="btn btn-go" onclick="window.print()">Print / save</button><button class="btn bdark" onclick="closeSum()">Close</button></div></div></div>';
 document.getElementById("modal").innerHTML=h; }
function closeSum(){ document.getElementById("modal").innerHTML=""; }
document.getElementById("tenantSel").addEventListener("change",e=>switchVillage(e.target.value));
function wireTabs(id){ const el=document.getElementById(id); if(!el)return; el.addEventListener("click",e=>{ const b=e.target.closest("button[data-view]"); if(b){ e.preventDefault(); go(b.getAttribute("data-view")); } }); }
wireTabs("nav"); wireTabs("tabs");

renderNav(); render();
</script>
</body>
