<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVOD — African Village of Discovery</title>
<style>
:root{--gold:#C9A227;--terra:#C0532F;--cream:#F4EAD3;--mut:#9d8a63;--ink:#161009;--panel:#1e1509;}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font-family:'Avenir Next','Segoe UI','Helvetica Neue',sans-serif}
body.landing .wrapside{display:none}
body.landing .mainbar{max-width:none;padding:0}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.wrap{display:flex;min-height:100vh}
.wrapside{width:228px;flex-shrink:0;border-right:1px solid rgba(201,162,39,.22);padding:22px 14px;background:linear-gradient(180deg,#1b130a,#161009);position:sticky;top:0;height:100vh;overflow:auto}
.main{flex:1;padding:26px 30px 80px;max-width:1180px;margin:0 auto;width:100%}
.vmark{text-align:center;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid rgba(201,162,39,.25)}
.vmark b{font-family:Palatino,Georgia,serif;font-size:21px;letter-spacing:.28em;color:var(--gold)}
.vmark div{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.tenant{width:100%;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.35);color:var(--cream);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:12px;cursor:pointer}
nav button,.tabs button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#CBB68D;text-align:left;padding:9px 11px;border-radius:6px;font-size:13.5px;transition:background .15s,color .15s}
nav button:hover,.tabs button:hover{background:rgba(201,162,39,.12);color:var(--cream)}
nav button.on,.tabs button.on{background:linear-gradient(90deg,rgba(201,162,39,.26),rgba(201,162,39,.08));color:#FFD870;border-left:3px solid var(--gold);padding-left:8px}
.sidefoot{margin-top:18px;padding-top:14px;border-top:1px dashed rgba(201,162,39,.25);text-align:center}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:6px 0 20px;border-bottom:3px double rgba(201,162,39,.45);margin-bottom:22px}
.kick{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--terra);margin-bottom:6px}
h1{font-family:Palatino,Georgia,serif;font-size:34px;margin:0;font-weight:500}
.hsub{color:var(--mut);font-size:13.5px;margin-top:6px;font-style:italic}
.edge{color:var(--gold);letter-spacing:.5em;font-size:13px;opacity:.75}
h2{font-family:Palatino,Georgia,serif;font-size:26px;margin:0 0 4px;font-weight:500}
.vsub{color:var(--mut);font-size:13px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:3px double rgba(201,162,39,.4)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px}
.stat{border:1px solid rgba(201,162,39,.3);border-radius:8px;padding:14px;background:linear-gradient(160deg,rgba(192,83,47,.14),rgba(201,162,39,.05))}
.stat .n{font-family:Palatino,Georgia,serif;font-size:30px;color:#FFD870;margin:4px 0 2px}
.stat .l{font-size:12px}.stat .s{font-size:11px;color:var(--mut);margin-top:2px}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}.cols>*{min-width:0}
.panel{border:1px solid rgba(201,162,39,.28);border-radius:10px;background:rgba(255,231,180,.03);padding:18px;margin-bottom:18px}
.ptitle{font-family:Palatino,Georgia,serif;font-size:16px;color:#FFD870;padding-bottom:12px;border-bottom:1px solid rgba(201,162,39,.2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.prow{margin-bottom:16px}.prow .pt{font-size:14px}.prow .ps{font-size:11.5px;color:var(--mut);margin:2px 0 6px}
.prow .pct{font-family:Palatino,Georgia,serif;font-size:20px;color:#FFD870;float:right}
.bar{height:7px;border-radius:4px;background:rgba(201,162,39,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--terra),var(--gold))}
.au{padding:9px 0;border-bottom:1px dashed rgba(201,162,39,.18)}.au .a{font-size:13px}.au .m{font-size:11.5px;color:var(--mut);margin-top:2px}.au .w{font-size:10.5px;color:#6f6248;margin-top:1px}
.badge{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid}
.b-pub{color:#8fce9e;border-color:rgba(143,206,158,.5)}.b-draft{color:#e0b25f;border-color:rgba(224,178,95,.5)}.b-flag{color:#e08a7a;border-color:rgba(224,138,122,.5)}.b-done{color:#8fcbdd;border-color:rgba(143,203,221,.5)}
.course{border:1px solid rgba(201,162,39,.22);border-radius:8px;padding:13px 14px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.course:hover{border-color:rgba(201,162,39,.55)}.course.on{border-color:var(--gold);background:rgba(201,162,39,.09)}
.course .ct{font-family:Palatino,Georgia,serif;font-size:16.5px}.course .cm{font-size:11.5px;color:var(--mut);margin:4px 0}.course .cd{font-size:12.5px;color:#CBB68D;line-height:1.45}
.mod{border:1px solid rgba(201,162,39,.22);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.mod .mt{font-size:14.5px}.mod .mo{font-size:11.5px;color:var(--mut);font-style:italic;margin-top:2px}
.les{display:flex;gap:8px;align-items:center;padding:7px 0 7px 26px;border-bottom:1px dotted rgba(201,162,39,.15);color:#CBB68D;font-size:12.5px;cursor:pointer}
.les:hover{color:var(--cream)}.les .lm{font-size:11px;color:#6f6248;margin-left:auto}
.les .done{color:#8fce9e;margin-left:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border-bottom:2px solid rgba(201,162,39,.4)}
.t td{padding:9px 10px;border-bottom:1px solid rgba(201,162,39,.14);color:#E8DCBF}
.post{border:1px solid rgba(201,162,39,.22);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.post .pa{font-family:Palatino,Georgia,serif;font-size:14.5px;color:#FFD870}.post .pb{font-size:13px;color:#E8DCBF;line-height:1.5;margin:6px 0 8px}
.post .ps{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.post .pact{display:flex;gap:8px;margin-top:6px}
.jhero{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:3px double rgba(201,162,39,.4)}
.jname{font-family:Palatino,Georgia,serif;font-size:28px}
.jcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.jcard{border:1px solid rgba(201,162,39,.28);border-radius:12px;padding:16px;background:linear-gradient(165deg,rgba(192,83,47,.10),rgba(201,162,39,.04))}
.jtop{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}.ring svg{transform:rotate(-90deg)}
.ring .rp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Palatino,Georgia,serif;font-size:15px;color:#FFD870}
.jct{font-family:Palatino,Georgia,serif;font-size:16px;line-height:1.25}.jcl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-top:3px}
.jnext{margin-top:12px;padding:9px 11px;border-left:3px solid var(--gold);background:rgba(201,162,39,.08);border-radius:0 6px 6px 0;font-size:12.5px;color:#E8DCBF;line-height:1.4}
.jnext em{font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#FFD870;display:block;margin-bottom:2px}
.jd{color:#8fce9e}.jcta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(201,162,39,.18)}
.mname{width:180px;flex-shrink:0;font-size:13px}.mnote{font-size:11px;color:var(--mut);font-style:italic;margin-top:2px}
.mtrack{flex:1;height:8px;border-radius:4px;background:rgba(201,162,39,.14);overflow:hidden}
.mfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--terra),#FFD870)}
.mlvl{width:96px;flex-shrink:0;text-align:right;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.btn{background:transparent;border:1px solid rgba(201,162,39,.5);color:#FFD870;border-radius:6px;padding:6px 12px;font-size:12px;letter-spacing:.06em;transition:background .15s}
.btn:hover{background:rgba(201,162,39,.16)}
.btn-go{background:linear-gradient(90deg,var(--terra),var(--gold));color:#161009;border:none;font-weight:600}
.btn-go:hover{background:linear-gradient(90deg,#d06039,#dbb441)}
.btn-sm{padding:4px 10px;font-size:11.5px}
.btn-danger{border-color:rgba(224,138,122,.5);color:#e08a7a}
.bdark{border-color:rgba(60,45,20,.5);color:#442f10}
.input{background:rgba(22,16,9,.75);border:1px solid rgba(201,162,39,.35);color:var(--cream);border-radius:6px;padding:9px 11px;font-size:13px;width:100%;box-sizing:border-box}
.input:focus{outline:none;border-color:var(--gold)}
.input::placeholder{color:#6f6248}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.form{display:flex;flex-direction:column;gap:9px;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(201,162,39,.25)}
.formtitle{font-family:Palatino,Georgia,serif;font-size:14.5px;color:#FFD870;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(201,162,39,.25)}
.overlay{position:fixed;inset:0;background:rgba(12,8,4,.86);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.sum{background:#F6EFDA;color:#352A17;width:470px;max-width:100%;max-height:88vh;overflow:auto;border-radius:14px;padding:24px;border:1px solid rgba(201,162,39,.6);box-shadow:0 18px 60px rgba(0,0,0,.55)}
.sum .ban{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:3px double rgba(160,124,30,.55);margin-bottom:14px}
.sum .ban b{font-family:Palatino,Georgia,serif;font-size:19px;color:#6d5714}.sum .ban i{font-style:normal;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9c7e3c;display:block;margin-top:2px}
.sum .who{font-family:Palatino,Georgia,serif;font-size:24px;margin-bottom:12px}.sum .who span{display:block;font-size:12px;color:#8a6f34;margin-top:3px}
.sstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sstat div{text-align:center;border:1px solid rgba(160,124,30,.4);border-radius:10px;padding:9px 6px;background:rgba(201,162,39,.08)}
.sstat b{display:block;font-family:Palatino,Georgia,serif;font-size:21px;color:#a35c17}.sstat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9c7e3c}
.ssec .st{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a35c17;margin:10px 0 6px;display:block;font-weight:600}
.sline{font-size:13px;color:#442f10;padding:4px 0 4px 12px;border-left:3px solid rgba(163,92,23,.5);margin:5px 0}
.sline em{display:block;font-style:normal;font-size:11px;color:#9c7e3c;margin-top:1px}
.sfoot{text-align:center;font-size:11px;color:#9c7e3c;font-style:italic;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(160,124,30,.45)}
.sact{display:flex;gap:8px;justify-content:center;margin-top:12px}
.bprev{border-radius:10px;padding:26px;margin-bottom:18px;border:1px solid rgba(201,162,39,.35)}
.bprev .bt{font-family:Palatino,Georgia,serif;font-size:26px}.bprev .bd{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:4px;opacity:.85}
.note{position:fixed;bottom:18px;right:22px;background:#241808;border:1px solid var(--gold);color:#FFD870;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:80}
.demobar{background:linear-gradient(90deg,var(--terra),var(--gold));color:var(--ink);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;text-align:center;padding:6px;position:relative;z-index:5}
.chip{display:inline-block;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.35);border-radius:20px;padding:3px 10px;font-size:11.5px;color:#E8DCBF;margin:2px 4px 2px 0}
.player{display:grid;grid-template-columns:300px 1fr;gap:18px}
.plist{border:1px solid rgba(201,162,39,.28);border-radius:10px;overflow:hidden;background:rgba(255,231,180,.03)}
.plist .modh{padding:11px 14px;background:rgba(201,162,39,.08);border-bottom:1px solid rgba(201,162,39,.2)}
.plist .modh b{font-family:Palatino,Georgia,serif;font-size:14px;display:block}
.plist .modh i{font-style:italic;font-size:11px;color:var(--mut)}
.plist .pitem{display:flex;gap:9px;align-items:center;padding:10px 14px;border-bottom:1px dotted rgba(201,162,39,.14);font-size:13px;color:#CBB68D;cursor:pointer}
.plist .pitem:hover{background:rgba(201,162,39,.08);color:var(--cream)}
.plist .pitem.on{background:rgba(201,162,39,.14);color:#FFD870;border-left:3px solid var(--gold)}
.plist .pitem .pd{font-size:10.5px;color:#6f6248;margin-left:auto}
.plist .pitem .tick{color:#8fce9e}
.pstage{border:1px solid rgba(201,162,39,.28);border-radius:10px;background:rgba(255,231,180,.03);padding:20px;min-height:380px}
.pstage h3{font-family:Palatino,Georgia,serif;margin:0 0 4px;font-size:21px}
.pstage .pcrumb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin-bottom:10px}
.vid{aspect-ratio:16/9;border-radius:12px;background:#241808 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><text y="26" font-size="26" fill="%23C9A227" opacity="0.35">%E2%97%86</text></svg>');border:1px solid rgba(201,162,39,.35);display:flex;align-items:center;justify-content:center;position:relative;margin:14px 0}
.vid .playb{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--terra),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;color:#161009;box-shadow:0 8px 30px rgba(192,83,47,.45);cursor:pointer;transition:transform .15s}
.vid .playb:hover{transform:scale(1.07)}
.reading{font-size:14px;line-height:1.75;color:#E8DCBF}.reading p{margin:0 0 14px}
.steps label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dotted rgba(201,162,39,.18);font-size:13.5px;color:#E8DCBF;cursor:pointer}
.steps input{accent-color:var(--gold);margin-top:3px;transform:scale(1.2)}
.quizopt{display:block;width:100%;text-align:left;background:rgba(201,162,39,.06);border:1px solid rgba(201,162,39,.3);border-radius:8px;padding:11px 13px;color:var(--cream);font-size:13.5px;margin-bottom:8px;transition:border-color .12s,background .12s}
.quizopt:hover{border-color:var(--gold)}
.quizopt.sel{background:rgba(201,162,39,.2);border-color:var(--gold)}
.quizopt.right{background:rgba(143,206,158,.15);border-color:#8fce9e;color:#cfeed9}
.quizopt.wrong{background:rgba(224,138,122,.14);border-color:#e08a7a;color:#f2c9c1}
.qq{font-family:Palatino,Georgia,serif;font-size:17px;margin:8px 0 12px}
.qmeta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.pstage .pfoot{margin-top:16px;padding-top:14px;border-top:1px dashed rgba(201,162,39,.25);display:flex;gap:8px;flex-wrap:wrap}
.gcard{border:1px solid rgba(201,162,39,.26);border-radius:10px;overflow:hidden;background:rgba(255,231,180,.03)}
.gcard .gthumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:40px}
.gcard .gpad{padding:12px 14px}
.gcard .gt{font-size:13.5px;color:var(--cream)}.gcard .gc{font-size:11.5px;color:var(--mut);font-style:italic;margin-top:3px;line-height:1.4}
.gcard .gw{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-top:8px}
.ggal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.avbadge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,rgba(192,83,47,.3),rgba(201,162,39,.2));border:1px solid rgba(201,162,39,.4);border-radius:20px;padding:4px 12px;font-size:11.5px;color:#FFD870;letter-spacing:.06em}
.evcard{border:1px solid rgba(201,162,39,.26);border-radius:10px;padding:16px;background:linear-gradient(165deg,rgba(192,83,47,.10),rgba(201,162,39,.04));display:flex;gap:14px}
.evdate{flex-shrink:0;width:60px;text-align:center;border:1px solid rgba(201,162,39,.4);border-radius:10px;padding:8px 4px;background:rgba(201,162,39,.09)}
.evdate b{display:block;font-family:Palatino,Georgia,serif;font-size:22px;color:#FFD870}.evdate span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.evt b{font-family:Palatino,Georgia,serif;font-size:16px}.evt .em{font-size:12px;color:var(--mut);margin:4px 0}.evt .ed{font-size:12.5px;color:#CBB68D;line-height:1.5}
.lhero{min-height:86vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 22px;background:radial-gradient(1100px 500px at 50% -10%,rgba(201,162,39,.16),transparent),radial-gradient(800px 500px at 80% 110%,rgba(192,83,47,.10),transparent)}
.lHero-mark{font-family:Palatino,Georgia,serif;font-size:64px;letter-spacing:.32em;color:var(--gold);margin:0}
.lHero-sub{font-family:Palatino,Georgia,serif;font-size:22px;color:var(--cream);margin:8px 0 16px}
.lHero-tag{color:var(--mut);font-size:15px;max-width:560px;line-height:1.6}
.lbtns{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.lbtn{padding:13px 26px;border-radius:10px;font-size:14px;letter-spacing:.08em;border:1px solid rgba(201,162,39,.55);background:transparent;color:#FFD870}
.lbtn.g{background:linear-gradient(90deg,var(--terra),var(--gold));color:var(--ink);border:none;font-weight:700}
.lsec{max-width:1020px;margin:0 auto;padding:56px 22px}
.lsec h2{text-align:center;margin-bottom:8px}
.lsec .lsub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:30px}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lcell{border:1px solid rgba(201,162,39,.26);border-radius:12px;padding:20px;background:rgba(255,231,180,.03)}
.lcell b{font-family:Palatino,Georgia,serif;color:#FFD870;font-size:15.5px}
.lcell p{font-size:12.5px;color:#CBB68D;line-height:1.55;margin:8px 0 0}
.lform{max-width:560px;margin:0 auto;border:1px solid rgba(201,162,39,.35);border-radius:14px;padding:26px;background:rgba(255,231,180,.03)}
.lform input,.lform select{background:rgba(22,16,9,.75);border:1px solid rgba(201,162,39,.35);color:var(--cream);border-radius:6px;padding:10px 12px;font-size:13.5px;width:100%;box-sizing:border-box;margin-bottom:10px}
.lform input:focus{outline:none;border-color:var(--gold)}
.lform .hint{font-size:11.5px;color:var(--mut);margin:-4px 0 10px}
.lcolors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcolors input[type=color]{padding:2px;height:40px}
.lfoot{text-align:center;padding:38px 20px 60px;color:#6f6248;font-size:12px;border-top:1px solid rgba(201,162,39,.18)}
.cer{position:fixed;inset:0;background:radial-gradient(900px 600px at 50% 30%,rgba(201,162,39,.14),transparent),#161009;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.cer .cmark{font-family:Palatino,Georgia,serif;font-size:52px;color:var(--gold);letter-spacing:.3em;animation:cerin 1.4s ease}
.cer .cline{font-family:Palatino,Georgia,serif;font-size:20px;color:var(--cream);margin-top:18px;animation:cerin 1.4s .35s both}
.cer .csub{color:var(--mut);font-size:13.5px;margin-top:10px;font-style:italic;animation:cerin 1.4s .7s both}
@keyframes cerin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tabs{display:none}.mbtn{display:none}.bdrop{display:none}

  .wrap{flex-direction:column}

/* rich lesson bodies */
lessonContent: {
"Rivers of Life: The Nile, Niger & Congo":{body:"Three rivers shaped three worlds. The Nile carried grain to pharaohs, the Niger fed the cities of Mali, and the Congo pulsed through rainforest kingdoms. In this lesson you learn to read a river like a historian — following it from source to mouth, meeting the people who built their lives along its banks."},
"Map Lab: Deserts, Savannahs & Rainforests":{body:"You have a blank map of Africa and eleven species in the wings. Place each biome — the Sahara's dunes, the Serengeti's grass, the Congo's green heart — then hide your species inside it and tag where each belongs.",steps:["Draw the outline of the continent and mark the equator","Color the Sahara, the savannah belt, and the rainforest basin","Place at least six species where they actually live","Annotate one river and one mountain range with a fact each","Share your map in the Showcase Gallery"]},

"Kush & Aksum: Iron, Ivory & Faith":{body:"South of Egypt rose Kush, an iron-working power whose queens commanded armies. Farther east, Aksum's merchants filled the Red Sea with ships. Learn how these two kingdoms rewrote Africa's place in the ancient world — minting their own coins, raising stone stelae, and writing their own histories."},
"Mansa Musa & the Empire of Gold":{body:"When Mansa Musa walked to Mecca in 1324, he carried so much gold that he shook its price for a decade. Discover how Mali's emperor turned Timbuktu into a library of the world — and what a king's caravan tells us about power, faith, and generosity."},
"Reading: The Weeping Camel of Timbuktu":{body:"A short story from the caravan routes. As you read, mark the places where the desert itself becomes a character — where thirst, distance, and starlight decide the plot."},
"The Swahili Coast & the Indian Ocean World":{body:"From Kilwa to Mogadishu, Swahili cities thrived where Africa met the monsoon winds. Ivory, gold, and ideas flowed to India and beyond — and the coast's language still carries the words of every trader who ever landed."},
"Big Think: Who Owns the Trade Routes?":{body:"The village council is split: should the caravans be owned by families, by the market guild, or by no one at all? Prepare your case.",steps:["Pick your side: families, guild, or shared commons","List two benefits and two risks of your model","Compare with how the Swahili Coast organized trade","Write your three-sentence pitch for the council","Post your pitch in Journey Stories"]},
"Producers, Predators & Decomposers":{body:"Every savannah meal starts with grass and ends with mushrooms. Meet the producers who catch sunlight, the predators who keep herds honest, and the decomposers who return it all to the soil."},
"Build-a-Biome: The Serengeti Food Web":{body:"Your table is an ecosystem in miniature. Arrange the cards, connect the arrows, and then let the drought card fall — what collapses first, and why?",steps:["Lay out producers, herbivores, carnivores, and decomposers","Draw energy-flow arrows from grass to apex","Test the drought and poaching scenario cards","Record which species fall first","Write one rule your village could live by"]},
"Quiz: Energy Flow":{quiz:[
 {q:"In a food web, energy begins with…", o:["Apex predators","Decomposers","Producers catching sunlight","The wind"], a:2},
 {q:"If grasses fail in a drought, what happens first?", o:["Lions migrate immediately","Herbivore populations drop","Decomposers die out","Nothing changes"], a:1},
 {q:"Roughly how much energy passes up each food-chain level?", o:["All of it","Half","About 10%","None"], a:2}]},
"Following the Rains: The Great Migration":{body:"Two million wildebeest follow the rain in a circle older than any road. Track their route on the map and discover how water — not walls — draws the lines of survival."},
"Design Project: A Water-Wise Village":{body:"Your design brief: a village of forty families, one seasonal river, and a long dry season ahead. Sketch where homes, gardens, and well belong so that no drop is wasted.",steps:["List the village's water needs across the year","Choose a well site and two rainwater catchments","Zone gardens downhill from the well","Add one conservation rule the whole village follows","Share the sketch in the Showcase Gallery"]},
"Meeting the Griot":{body:"The griot holds seven centuries in memory without a single page. Watch how praise names travel, and learn the opening formula every storyteller uses to wake the ancestors."},
"Your Family Praise Poem":{body:"Every lineage has its song. Interview an elder, gather three names and one deed, and shape them into your own praise lines to perform at the next circle.",steps:["Choose an elder to interview (or a family story you know)","Collect three names and one proud deed","Write three lines following the griot's pattern","Practice with the call-and-response rhythm","Perform at our next circle"]},
"Barter to Bank: A Brief History of Money":{body:"Before coins there were cattle, before banks there were granaries. Walk the road from salt-and-cloth trading to mobile money, and see how trust — not metal — is what money has always been made of."},
"My First Savings Map":{body:"Where does your money actually go? Split what you earn or receive into needs, wants, and seeds (savings). Draw the river of your month and dam it before the wants flood everything.",steps:["List every place money came from and went to last month","Sort each line into needs, wants, or seeds","Set a seeds goal for next month — any amount counts","Pick one want to trade for a seed this week","Post your map in the Showcase Gallery"]},

function lessonsList(c,learn){ let out=[];(c.modules||[]).forEach(m=>m.ls.forEach(l=>out.push({m:m.t,t:l[0],ty:l[1],min:l[2]})));
  if(learn){ const doneMap=Object.assign({},learn.done);
    Object.keys(doneMap).forEach(()=>0);
    (learn.done[c.id]||[]).concat(extraDone(S.village,learn.id,c.id)).forEach(d=>{let o=out.find(o=>o.t===d[0]);if(o)o.done=d;});
    ((learn.doing[c.id])||[]).forEach(t=>{let o=out.find(x=>x.t===t);if(o)o.doing=true;}); }
  return out; }
function flatLessons(c){ return lessonsList(c); }
function learnerDone(l,cid,Sv){return (l.done[cid]||[]).concat(extraDone(Sv||(S.village),l.id,cid));}
function lessonPct(c,l){ const ll=lessonsList(c); const dn=learnerDone(l,c.id).length; return ll.length?Math.round(dn/ll.length*100):0; }
function badge(st){ return '<span class="badge '+(st==="flagged"?"b-flag":st==="published"||st==="active"||st==="graded"?"b-pub":st==="completed"?"b-done":"b-draft")+'">'+st+'</span>'; }

 const app=document.getElementById("app");

/* ============ COURSE PLAYER ============ */
function openCourse(cid, lid){ S.playerCourse=cid; if(lid)S.JL=lid; S.playerLesson=null; S.quiz=null; go("player"); }
function pickLesson(t){ S.playerLesson=t; S.quiz=null; renderAll(); }
function pickedLearner(){ const c=cls(); return c.learners.find(x=>x.id===S.JL) || c.learners.filter(x=>x.status==="active")[0]; }
function renderPlayer(app,c){
 let co=c.courses.find(x=>x.id===S.playerCourse);
 if(!co){ co=c.courses[0]; if(co)S.playerCourse=co.id; }
 const l=pickedLearner();
 if(!co){ app.innerHTML='<div class="vhead"><h2>Course Player</h2><div class="vsub">No courses in this classroom yet.</div></div>'; return; }
 const ll=lessonsList(co,l);
 if(!S.playerLesson){ const first = ll.find(o=>!o.done); S.playerLesson = (first||ll[0]).t; }
 const cur = ll.find(o=>o.t===S.playerLesson) || ll[0];
 const body = DATA.lessonContent[cur.t] || {};
 /* left rail */
 let rail=""; co.modules.forEach((m,mi)=>{
   rail+='<div class="modh"><b>Module '+(mi+1)+' · '+m.t+'</b><i>'+m.o+'</i></div>';
   m.ls.forEach(x=>{ const done=ll.find(o=>o.t===x[0]&&o.done); const doing=ll.find(o=>o.t===x[0]&&o.doing);
    rail+='<div class="pitem'+(cur.t===x[0]?' on':'')+'" onclick="pickLesson(\''+x[0].replace(/'/g,"\\'")+'\')"><span>'+(x[1]==="quiz"?"🧭":x[1]==="video"?"▶":x[1]==="project"?"🛠":"📜")+'</span> '+x[0]+'<span class="pd">'+x[2]+'m</span>'+(done?'<span class="tick">✓</span>':doing?'<span class="tick" style="color:#e0b25f">◐</span>':"")+'</div>'; }); });
 /* stage */
 let done=ll.find(o=>o.done), ldone=cur&&cur.done;
 let stage='<div class="pcrumb">'+co.title+' › '+cur.m+'</div><h3>'+cur.t+'</h3><div class="qmeta">'+cur.ty+' · '+cur.min+' min'+(ldone?' · ✓ completed '+cur.done[1]+(cur.done[2]!=null?' · '+cur.done[2]+'%':""):"")+'</div>';
 if(cur.ty==="video"){
   stage+='<div class="vid"><div class="playb" onclick="note(\'Demo stream — video would play here.\')">▶</div></div>';
   stage+='<div class="reading"><p>'+(body.body||"")+'</p></div>';
 } else if(cur.ty==="pdf"){
   stage+='<div class="reading"><p>'+(body.body||"")+'</p><p>Across dunes the caravan keeps its pace. A camel does not weep — but the story does, softly, where the wells run low. You are the one who decides how the story ends.</p><p>When you finish reading, note one image that will stay with you, and bring it to the circle.</p></div>';
 } else if(cur.ty==="project"){
   const steps=(body.steps||["Read the brief","Do the work","Share it with the village"]).map((s2,i)=>'<label><input type="checkbox" onchange="note(this.checked?\'Step '+(i+1)+' checked.\':\'\')"/> <span>'+s2+'</span></label>').join("");
   stage+='<div class="reading"><p>'+(body.body||"")+'</p></div><div class="steps">'+steps+'</div>';
 } else if(cur.ty==="quiz"){
   const q=body.quiz||[];
   const Q=S.quiz||{i:0,sel:null,score:0,done:false,answers:{}};
   S.quiz=Q;
   if(!q.length){ stage+='<div class="hsub">Quiz content coming.</div>'; }
   else if(Q.done){
    const pct=Math.round(Q.score/q.length*100);
    stage+='<div class="panel" style="margin-top:18px"><div class="ptitle">Quiz complete</div><div style="font-family:Palatino,Georgia,serif;font-size:38px;color:#FFD870;margin:8px 0 2px">'+pct+'%</div><div class="hsub" style="font-style:normal">'+Q.score+' of '+q.length+' correct'+(ldone?' · recorded '+cur.done[1]:"")+'</div><div style="margin-top:14px"><button class="btn btn-sm" onclick="retakeQuiz()">Retake</button></div></div>';
   } else {
    const qn=Q.i; const qq=q[qn];
    stage+='<div style="margin-top:16px"><div class="qmeta">Question '+(qn+1)+' of '+q.length+'</div><div class="qq">'+qq.q+'</div>';
    qq.o.forEach((o,oi)=>{ stage+='<button class="quizopt'+(Q.sel===oi?' sel':'')+'" onclick="quizSel('+oi+')">'+o+'</button>'; });
    stage+='<div class="pfoot"><button class="btn btn-go" '+(Q.sel==null?'disabled style="opacity:.5"':'')+' onclick="quizNext()">'+(qn===q.length-1?'Finish quiz':'Next question')+'</button></div></div>';
   }
 }
 if(cur.ty!=="quiz" && !ldone){ stage+='<div class="pfoot"><button class="btn btn-go" onclick="completeLesson()">Mark as done</button></div>'; }
 if(cur.ty==="quiz" && !ldone && S.quiz && !S.quiz.done){ /* buttons live in quiz block */ }
 stage += '<div class="pfoot"><button class="btn" onclick="go(\'journey\')">Back to the journey</button></div>';
 app.innerHTML='<div class="vhead"><div><h2>'+co.title+'</h2><div class="vsub">'+(l?l.name+"'s progress":"Pick a learner to track")+' · '+ll.filter(o=>o.done).length+' of '+ll.length+' lessons done · '+c.name+'</div></div><div><select class="tenant" style="max-width:230px" onchange="setJL(this.value)">'+c.learners.filter(x=>x.status==="active").map(x=>'<option value="'+x.id+'" '+(x.id===(l?l.id:"")?"selected":"")+'>'+x.name+' (G'+x.grade+')</option>').join("")+'</select></div></div>'
  +'<div class="player"><div class="plist">'+rail+'</div><div class="pstage">'+stage+'</div></div>';
}
function quizSel(i){ if(S.quiz && !S.quiz.done) S.quiz.sel=i; renderAll(); }
function quizNext(){ const Q=S.quiz; if(!Q||Q.sel==null)return;
 const co=cls().courses.find(x=>x.id===S.playerCourse); const cur=lessonsList(co).find(o=>o.t===S.playerLesson); const body=DATA.lessonContent[cur.t]; const q=body.quiz[Q.i];
 const right=(Q.sel===q.a); if(right)Q.score++; Q.clickLast=Q.sel; Q.lastRight=right;
 Q.sel=null;
 if(Q.i>=body.quiz.length-1){ Q.done=true; markExtra(S.village, S.JL, S.playerCourse, cur.t, Math.round(Q.score/body.quiz.length*100)); note("Quiz complete — "+Math.round(Q.score/body.quiz.length*100)+"% recorded to the journey."); }
 else { Q.i++; }
 renderAll(); }
function retakeQuiz(){ S.quiz={i:0,sel:null,score:0,done:false,answers:{}}; renderAll(); }
function completeLesson(){ const co=cls().courses.find(x=>x.id===S.playerCourse); const cur=lessonsList(co).find(o=>o.t===S.playerLesson); if(!cur)return;
 markExtra(S.village, S.JL, S.playerCourse, S.playerLesson, null);
 note(cur.t+" marked done for "+pickedLearner().name.split(" ")[0]+".");
 renderAll(); }

 +'<button class="btn btn-go" type="submit">Create draft</button></form></div>'

}
function publishCourse(cid){ const x=cls().courses.find(v=>v.id===cid); x.status="published"; chron("course.published",x.title); note(x.title+" is live in the village."); renderAll(); }
function unpublishCourse(cid){ const x=cls().courses.find(v=>v.id===cid); x.status="draft"; chron("course.unpublished",x.title); note(x.title+" returned to draft."); renderAll(); }

 +'<div class="panel"><div class="ptitle">Speak to the village</div><form class="form" style="margin:0;padding:0;border:none" onsubmit="return postForm(event)">'
 +'<select class="input" id="vp-space"><option>Showcase Gallery</option><option>Journey Stories</option><option>Garden Chat</option><option>Events Circle</option></select>'

/* ============ CHRONICLE ============ */
function chron(action, subject){ cls().audit.unshift([new Date().toISOString().slice(0,16).replace("T"," "), S.role+"@avod.demo", action, subject]); saveState(); }
function renderChronicle(app,c){ app.innerHTML='<div class="vhead"><div><h2>The Chronicle</h2><div class="vsub">Every meaningful act in this classroom, written down — who, what, and when.</div></div></div><div class="panel"><table class="t"><tr><th>When</th><th>Actor</th><th>Action</th><th>Subject</th></tr>'+c.audit.map(a=>'<tr><td>'+a[0]+'</td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td></tr>').join("")+'</table></div>'; }

/* ============ SUPER ADMIN ============ */
function renderAdmin(){ const app=document.getElementById("app");
 const ids=Object.keys(DATA.classrooms);
 let totL=0, totC=0, totE=0, totF=0;
 ids.forEach(k=>{ const x=DATA.classrooms[k]; totL+=x.learners.filter(l=>l.status==="active").length; totC+=x.courses.length; totE+=x.learners.reduce((a,l)=>a+l.enroll.length,0); totF+=x.posts.filter(p=>p.st==="flagged").length; });
 let trows=""; ids.forEach(k=>{ const x=DATA.classrooms[k]; trows+='<tr><td>'+x.emoji+' '+x.name+'</td><td>'+x.domain+'</td><td>'+x.plan+'</td><td>'+x.learners.filter(l=>l.status==="active").length+'</td><td>'+x.courses.filter(cc=>cc.status==="published").length+'</td><td>'+x.posts.filter(p=>p.st==="flagged").length+'</td><td style="text-align:right"><button class="btn btn-sm" onclick="switchVillage(\''+k+'\')">Open</button></td></tr>'; });
 app.innerHTML='<div class="vhead"><div><h2>Super Admin</h2><div class="vsub">The network console — every village, every meter, every flagged post across AVOD.</div></div></div>'
 +'<div class="stats" style="grid-template-columns:repeat(4,1fr)">'
 +'<div class="stat"><div class="n">'+ids.length+'</div><div class="l">Villages</div><div class="s">classrooms on the network</div></div>'
 +'<div class="stat"><div class="n">'+totL+'</div><div class="l">Active learners</div><div class="s">across all villages</div></div>'
 +'<div class="stat"><div class="n">'+totE+'</div><div class="l">Enrollments</div><div class="s">journeys running</div></div>'
 +'<div class="stat"><div class="n">'+totF+'</div><div class="l">Flagged posts</div><div class="s">network moderation queue</div></div></div>'
 +'<div class="panel"><div class="ptitle">Village directory</div><table class="t"><tr><th>Village</th><th>Domain</th><th>Plan</th><th>Learners</th><th>Published</th><th>Flagged</th><th></th></tr>'+trows+'</table></div>'
 +'<div class="cols"><div class="panel"><div class="ptitle">Provisioning queue</div><div class="hsub" style="font-style:normal">Demo: brand-new communities appear here after the interest form on the landing page is submitted.</div>'
 +(DATA._interest||[]).map(r=>'<div class="au"><div class="a">'+r.name+' · '+r.org+'</div><div class="m">'+r.email+' · wants a '+r.style+' village · tz '+r.tz+'</div><div class="w">queued '+r.when+'</div></div>').join("")||'<div class="hsub">No requests queued.</div>'
 +'</div><div class="panel"><div class="ptitle">Network notes</div><div class="au"><div class="a">Billing meter</div><div class="m">Usage-based billing hooks ready — meters feed Stripe when wired to production.</div></div><div class="au"><div class="a">Email automation</div><div class="m">Weekly journey summaries run Fridays 4:30 PM ET from the live AVOD workspace.</div></div><div class="au"><div class="a">Data model</div><div class="m">Tenants, learners, courses, mastery, community, audit — all scoped by village for isolation.</div></div></div></div>';
}

/* ============ INTEREST FORM ============ */
function submitInterest(e){ e.preventDefault(); const f=e.target; DATA._interest=DATA._interest||[];
 DATA._interest.unshift({name:f.iname.value, org:f.iorg.value, email:f.iemail.value, tz:f.itz.value, style:f.istyle.value, when:new Date().toISOString().slice(0,16).replace("T"," ")});
 chron("interest.submitted",f.iorg.value);
 f.reset(); note("Request queued in the Super Admin provisioning feed."); renderAll(); return false; }

/* ============ SUMMARY CARD ============ */
function copyParentLink(){ const u=new URL(location.href); u.searchParams.set("village",S.village); u.searchParams.set("journey",S.JL); const l=pickedLearner(); if(navigator.clipboard){navigator.clipboard.writeText(u.toString()).then(()=>note("Journey link copied — paste it to "+(l?l.name.split(" ")[0]+"'s":"the")+" family.")).catch(()=>prompt("Copy this link:",u));} else prompt("Copy this link:",u); }
function openSumCard(){ const c=cls(); const l=pickedLearner(); if(!l)return;
 let walked=[],nexts=[],tot=0,done=0;
 l.enroll.forEach(cid=>{ const co=c.courses.find(x=>x.id===cid); if(!co)return; const ll=lessonsList(co,l); done+=ll.filter(o=>o.done).length; tot+=ll.length; ll.filter(o=>o.done).forEach(o=>walked.push([o.t,co.title,o.done[2]])); const nx=ll.find(o=>!o.done); if(nx)nexts.push([nx.t,co.title,nx.ty,nx.min]); });
 const pct=tot?Math.round(done/tot*100):0; const mast=l.mastery.slice().sort((a,b)=>b[1]-a[1]).slice(0,4);
 let h='<div class="overlay" onclick="if(event.target===this)closeSum()"><div class="sum">'
  +'<div class="ban"><span style="font-size:26px">'+c.emoji+'</span><div><b>'+c.name+'</b><i>African Village of Discovery · Weekly Journey Summary</i></div></div>'
  +'<div class="who">'+l.name+'<span>Grade '+l.grade+' · Sep 2 – Sep 8</span></div>'
  +'<div class="sstat"><div><b>'+walked.length+'</b><span>steps this week</span></div><div><b>'+l.enroll.length+'</b><span>journeys underway</span></div><div><b>'+pct+'%</b><span>overall progress</span></div></div>';
 if(walked.length) h+='<div class="ssec"><span class="st">✦ Walked this week</span>'+walked.slice(0,5).map(w=>'<div class="sline">'+w[0]+'<em>'+w[1]+(w[2]!=null?" · "+w[2]+"%":"")+'</em></div>').join("")+'</div>';
 if(nexts.length) h+='<div class="ssec"><span class="st">◈ Up next</span>'+nexts.slice(0,3).map(n=>'<div class="sline">'+n[0]+'<em>'+n[1]+' · '+n[2]+' · '+n[3]+' min</em></div>').join("")+'</div>';
 if(mast.length) h+='<div class="ssec"><span class="st">❖ Growing mastery</span>'+mast.map(m=>'<div class="sline">'+m[0]+'<em>'+LEVELS[m[1]]+'</em></div>').join("")+'</div>';
 h+='<div class="sfoot">'+c.domain+' · shared with love by the village</div>'
  +'<div class="sact"><button class="btn btn-go" onclick="window.print()">Print / save</button><button class="btn bdark" onclick="closeSum()">Close</button></div></div></div>';
 document.getElementById("modal").innerHTML=h; }
function closeSum(){ document.getElementById("modal").innerHTML=""; }
